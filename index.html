<style>
:root{
  --bg:#f3f6f8;--card:#fff;--ink:#14212b;--muted:#5d6b78;--line:#e1e7ed;
  --brand:#0f766e;--brand-d:#0b5a54;--brand-l:#e6f4f2;
  --ok:#15803d;--ok-l:#dcfce7;--warn:#a16207;--warn-l:#fef3c7;--bad:#b91c1c;--bad-l:#fee2e2;--gray-l:#eef1f4;
  --r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:22px;margin:0 0 6px;line-height:1.25}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0}
p{margin:0 0 12px}
a{color:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.wrap.narrow{max-width:460px;padding-top:7vh}
.wrap.wide{max-width:1180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.pad{padding:22px}
.brand{text-align:center;margin-bottom:18px}
.brand .logo{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:8px}
.brand b{display:block;font-size:16px}
.brand span{color:var(--muted);font-size:13px}
.logo-img{width:88px;height:88px;border-radius:12px;object-fit:contain;display:block;margin:0 auto 8px}
.logo-img.sm{width:44px;height:44px;border-radius:10px;margin:0;flex:0 0 44px}
.logo-img.dflt,img.logo-img.dflt{border:0;padding:0;background:none;border-radius:0}
img.logo-img{background:none;border:0;padding:0;border-radius:0}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input,select{width:100%;padding:11px 12px;border:1px solid #c9d3dc;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
input:disabled{background:var(--gray-l);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:9px;border:1px solid #c9d3dc;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--gray-l)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.wa{background:#16a34a;border-color:#16a34a;color:#fff}
.btn.wa:hover{background:#15803d}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.block{display:flex;width:100%;margin-top:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.b-Belum{background:var(--bad-l);color:var(--bad)}
.b-Draft{background:var(--warn-l);color:var(--warn)}
.b-Disetor,.b-ok{background:var(--ok-l);color:var(--ok)}
.b-info{background:var(--gray-l);color:var(--muted)}
.b-Diwakilkan{background:#e0e7ff;color:#3730a3}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--brand-l);color:var(--brand-d);font-size:12px;font-weight:600}
.chip.tt{background:#ede9fe;color:#5b21b6}
.prog{height:9px;border-radius:99px;background:var(--gray-l);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.prog .g{background:#22a05b}.prog .y{background:#e9b422}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}

<body>
<div id="bar"></div>
<div id="loader"><div class="spin"></div><span>Mohon tunggu…</span></div>
<div id="app"><div class="splash"><div class="spin"></div>Memuat aplikasi…</div></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* ============================================================
 *  KONFIGURASI  -  ganti dengan URL Web App Apps Script Anda
 * ============================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxKPp2yCczPw5uLQI4hETy3E_GJ5hl2H2U4LkQwuagxLP8jF3fhQxkFibe6_vlR688c/exec'
};

/* ============================================================
 *  UTILITAS
 * ============================================================ */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n == null || n === '') ? '–' : Number(n).toLocaleString('id-ID', {maximumFractionDigits: 2});
const fmtTime = iso => iso ? new Date(iso).toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '–';
const guruLink = () => location.origin + location.pathname;

const S = {
  cfg: {}, guruList: [], savedGuru: localStorage.getItem('guru_id') || '',
  view: 'login', guru: null, tugas: [], cur: null, rows: [], locked: false, dirty: false,
  adminToken: sessionStorage.getItem('adm_tok') || '', dash: null, tab: 'dashboard',
  legerSel: '', leger: null, legerKey: null,
  expand: new Set(), filter: 'belum', q: '', kelasSel: '', rekap: null, timer: null
};

let busyCount = 0;
let loaderTimer = null;
// Satu indikator saja: overlay di tengah layar (tidak muncul bila halaman sedang menampilkan spinner "Memuat…").
function busy(d) {
  busyCount = Math.max(0, busyCount + d);
  const ld = document.getElementById('loader');
  if (busyCount > 0) {
    if (!loaderTimer && !ld.classList.contains('on')) loaderTimer = setTimeout(() => {
      loaderTimer = null;
      if (busyCount > 0 && !document.querySelector('#app .splash')) ld.classList.add('on');
    }, 250);
  } else { clearTimeout(loaderTimer); loaderTimer = null; ld.classList.remove('on'); }
}
async function run(fn) { busy(1); try { return await fn(); } catch (e) { toast(e.message || String(e), 'err'); } finally { busy(-1); } }

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 5000 : 2600);
}

function mount(html) { document.getElementById('app').innerHTML = html; window.scrollTo(0, 0); }
function openModal(html) { document.getElementById('modal-root').innerHTML = `<div class="modal-bg" data-act="closeModalBg"><div class="modal">${html}</div></div>`; }
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

async function api(action, payload, admin) {
  if (CONFIG.API_URL.startsWith('PASTE')) throw new Error('API_URL belum diisi di index.html');
  const body = JSON.stringify(Object.assign({action}, admin ? {token: S.adminToken} : {}, payload || {}));
  // Content-Type default (text/plain) agar tidak memicu preflight CORS pada Apps Script
  const r = await fetch(CONFIG.API_URL, {method: 'POST', body});
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Respons server tidak valid. Pastikan deploy Apps Script: akses "Anyone".'); }
  if (!j.ok) {
    if (j.error === 'AUTH') { adminLogout(true); throw new Error('Sesi admin berakhir, silakan masuk lagi.'); }
    throw new Error(j.error);
  }
  return j.data;
}

function parseNilai(raw) {
  const v = String(raw == null ? '' : raw).trim().replace(',', '.');
  if (v === '') return {empty: true};
  if (/^th$/i.test(v)) return {th: true, val: 'TH'};
  if (!/^\d+(\.\d+)?$/.test(v)) return {bad: true};
  const n = parseFloat(v);
  if (n > 100) return {bad: true};
  return {val: Math.round(n * 100) / 100};
}

// tampilkan desimal dengan koma (format Indonesia) di kolom isian
const tampil = v => String(v == null ? '' : v).replace('.', ',');

// "Diwakilkan" = guru lain di kelas/mapel yang sama sudah menyetor nilainya, jadi dianggap selesai
const isDone = s => s === 'Disetor' || s === 'Diwakilkan';
// Kode guru yang bisa diklik -> pop up berisi nama lengkap guru
function guruTag(label, gurus) {
  const arr = (gurus || []).map(g => ({k: g.kode, n: g.nama, p: g.peran || ''}));
  return `<button class="linkbtn" data-act="infoGuru" data-l="${esc(label)}" data-g="${esc(JSON.stringify(arr))}" title="Klik untuk melihat nama guru">${esc(label)}</button>`;
}
const guruNames = x => (x.gurus || []).map(g => g.kode + ' - ' + g.nama).join('; ');
// Keterangan singkatan mapel (list berisi {singkat, mapel})
function legendMapel(list) {
  const m = {};
  (list || []).forEach(x => { if (x.singkat) m[x.singkat] = x.mapel; });
  const k = Object.keys(m).sort((a, b) => a.localeCompare(b));
  if (!k.length) return '';
  return `<div class="abbr"><h4>Keterangan singkatan mapel</h4><ul>${k.map(s => `<li><b>${esc(s)}</b><span>${esc(m[s])}</span></li>`).join('')}</ul></div>`;
}
// Nama lengkap guru untuk tabel rekap: satu guru -> namanya; Team Teaching -> label + daftar nama
function guruNama(x) {
  const gs = x.gurus || [], inp = gs.filter(g => g.peran === 'Menginput nilai');
  if (!x.team) return esc(gs[0] ? gs[0].nama : '–');
  if (inp.length === 1) return esc(inp[0].nama);
  return `<span class="chip tt">Team Teaching</span><div class="gl">${gs.map(g => `<div>${esc(g.nama)}</div>`).join('')}</div>`;
}
// Keterangan singkatan & kode guru untuk file Excel
function ketAoa(cols) {
  const mp = {}, gr = {};
  cols.forEach(m => { mp[m.singkat] = m.mapel; (m.gurus || []).forEach(g => { gr[g.kode] = g.nama; }); });
  const out = [[], ['Keterangan Singkatan Mapel']].concat(Object.keys(mp).map(k => [k, mp[k]]));
  if (Object.keys(gr).length) out.push([], ['Keterangan Kode Guru'], ...Object.keys(gr).map(k => [k, gr[k]]));
  return out;
}
function teamNote(t) {
  if (!t.rekan || !t.rekan.length) return '';
  if (t.status === 'Diwakilkan') return `<div class="notice ok"><b>Sudah diwakilkan.</b> Nilai kelas ini sudah disetor oleh ${esc((t.wakil || []).map(w => w.kode + ' – ' + w.nama).join(', '))}, sehingga Anda dianggap sudah mengisi dan <b>tidak perlu mengisi</b>. Jika Anda tetap mengisi, nilai akhir menjadi rata-rata nilai Anda dan guru tersebut.</div>`;
  return `<div class="notice warn"><b>Team Teaching</b> bersama ${t.rekan.map(r => `<b>${esc(r.kode)}</b> (${esc(r.nama)})`).join(', ')}. Nilai akhir siswa = <b>rata-rata</b> nilai yang disetor tiap guru. Bila guru lain tidak mengisi, nilai Anda dipakai apa adanya.</div>`;
}

function petunjuk() {
  return `<details class="card help"><summary><b>📖 Petunjuk pengisian untuk guru</b> <span class="muted small">(ketuk untuk membuka)</span></summary>
  <div class="body">
    <b>Langkah-langkah</b>
    <ol>
      <li>Pilih nama Anda lalu klik <b>Masuk</b>. Daftar mapel dan kelas yang Anda ampu muncul otomatis.</li>
      <li>Klik <b>Isi nilai</b> pada kelas yang akan diisi. Daftar siswa kelas tersebut tampil dengan kolom nilai kosong.</li>
      <li>Ketik nilai di samping nama siswa, tekan <b>Enter</b> untuk pindah ke siswa berikutnya. (Opsional: tombol <b>Impor Excel</b> bila nilai sudah ada di file Excel.)</li>
      <li>Klik <b>Simpan draft</b> bila belum selesai. Anda bisa melanjutkan nanti dari perangkat mana pun.</li>
      <li>Bila semua siswa sudah terisi, klik <b>Periksa &amp; setor</b>. Cek ringkasan (rata-rata, tertinggi, terendah), lalu klik <b>Ya, setor nilai</b>.</li>
      <li>Ulangi untuk setiap mapel dan kelas. Setelah semua berstatus <b>Disetor</b>, klik <b>Selesai</b> agar panitia mendapat pemberitahuan.</li>
    </ol>
    <b>Aturan pengisian nilai</b>
    <ul>
      <li>Isi <b>nilai murni hasil ujian</b> siswa (bukan nilai akhir/rapor).</li>
      <li>Rentang nilai <b>0–100</b>. Nilai desimal boleh memakai <b>koma</b> (contoh <b>85,5</b>) atau <b>titik</b> (<b>85.5</b>), maksimal 2 angka di belakang koma.</li>
      <li><b>TH = Tidak Hadir.</b> Untuk siswa yang tidak mengikuti ujian, tekan tombol <b>TH</b> di samping kolom nilai (atau ketik TH). Siswa TH dianggap sudah terisi, tetapi <b>tidak dihitung</b> dalam rata-rata, nilai tertinggi/terendah, dan standar deviasi. Jangan diisi 0.</li>
      <li>Semua siswa harus terisi (angka atau TH) sebelum nilai bisa disetor.</li>
    </ul>
    <b>Mapel diajar beberapa guru (Team Teaching)</b>
    <ul>
      <li>Setiap guru mengisi nilainya sendiri. Nilai akhir siswa = <b>rata-rata</b> nilai dari guru yang mengisi.</li>
      <li>Bila hanya satu guru yang mengisi, nilainya dipakai <b>apa adanya</b> dan guru lain otomatis berstatus <b>Diwakilkan</b> (dianggap sudah mengisi).</li>
    </ul>
    <b>Salah input setelah disetor?</b>
    <ul><li>Buka kelas tersebut, klik <b>Revisi nilai</b>, perbaiki, lalu setor ulang.</li></ul>
  </div></details>`;
}

function badge(st) { return `<span class="badge b-${esc(st)}">${esc(st)}</span>`; }
function progBar(done, draft, total) {
  const g = total ? done / total * 100 : 0, y = total ? draft / total * 100 : 0;
  return `<div class="prog"><i class="g" style="width:${g}%"></i><i class="y" style="width:${y}%"></i></div>`;

const LOGO_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f766e"/><path d="M15 7h21l13 13v34a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z" fill="#fff"/><path d="M36 7v13h13z" fill="#9fd8d0"/><path d="M21 38l8 8 14-15" fill="none" stroke="#0f766e" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// URL logo dari sheet Config (kunci logo_url). Mendukung link Google Drive & URL gambar biasa.
function logoSrc() {
  const u = String((S.cfg && S.cfg.logo_url) || '').trim();
  if (!/^https?:\/\//i.test(u)) return '';
  // Google Drive mengubah PNG transparan menjadi berlatar hitam -> diabaikan, dipakai logo bawaan yang transparan
  if (/drive\.google\.com|googleusercontent\.com|docs\.google\.com/i.test(u)) return '';
  return u;
}
function logoSvg(cls) { return `<span class="logo-img ${cls || ''}" style="border:0;padding:0;background:none">${LOGO_SVG}</span>`; }
// Urutan: logo_url dari sheet Config (bukan link Google Drive) -> logo bawaan yang tertanam di file ini
function logoHtml(cls, paksaBawaan) {
  const src = paksaBawaan ? '' : logoSrc();
  if (!src) return `<img class="logo-img dflt ${cls || ''}" src="${LOGO_IMG}" alt="Logo" onerror="this.outerHTML=logoSvg('${cls || ''}'.trim())">`;
  return `<img class="logo-img ${cls || ''}" src="${esc(src)}" alt="Logo" onerror="this.outerHTML=logoHtml('${cls || ''}'.trim(), true)">`;
}
function setFavicon() {
  const src = logoSrc();
  if (S._fav === src) return;
  S._fav = src;
  if (!src) return;   // pakai favicon dari file (sudah ada di <head>)
  // logo dari Config dipakai hanya bila benar-benar bisa dimuat; bila gagal tetap memakai favicon file
  const im = new Image();
  im.onload = () => {
    document.querySelectorAll('link.fi-extra').forEach(e => e.remove());
    const f = document.getElementById('favicon'), t = document.getElementById('touchicon');
    f.removeAttribute('type'); f.setAttribute('href', src); t.setAttribute('href', src);
  };
  im.src = src;
}
function brand() {
  const c = S.cfg || {};
  setFavicon();
  return `<div class="brand">${logoHtml()}<b>${esc(c.nama_sekolah || 'Setor Nilai Ujian')}</b><span>${esc(c.nama_ujian || '')} ${c.tahun_ajaran ? '· ' + esc(c.tahun_ajaran) : ''}</span></div>`;
}

/* ============================================================
 *  ROUTER
 * ============================================================ */
function route() {
  clearInterval(S.timer);
  closeModal();
  if (location.hash.startsWith('#/admin')) initAdmin(); else initGuru();
}
window.addEventListener('hashchange', route);
window.addEventListener('load', route);

/* ============================================================
 *  HALAMAN GURU
 * ============================================================ */
async function initGuru() {
  mount('<div class="splash"><div class="spin"></div>Memuat…</div>');
  await run(async () => {
    S.cfg = await api('config');
    S.guruList = await api('guruList');
  });
  S.view = 'login';
  renderGuru();
}

function renderGuru() {
  if (S.view === 'login') mount(viewLogin());
  else if (S.view === 'tugas') mount(viewTugas());
  else if (S.view === 'input') mount(viewInput());
  else if (S.view === 'selesai') mount(viewSelesai());
}

function viewLogin() {
  const opts = S.guruList.map(g => `<option value="${esc(g.id)}" ${g.id === S.savedGuru ? 'selected' : ''}>${esc(g.nama)}${g.program && g.program.toLowerCase() !== 'umum' ? ' — ' + esc(g.program) : ''}</option>`).join('');
  return `<div class="wrap narrow">${brand()}
  <div class="card pad">
    <h1>Setor Nilai Ujian</h1>
    <p class="muted">Pilih nama Anda, lalu setorkan nilai untuk setiap mapel dan kelas yang Anda ampu.</p>
    <label for="guruSel">Nama guru</label>
    <select id="guruSel"><option value="">— pilih nama —</option>${opts}</select>
    <button class="btn primary block" data-act="masuk">Masuk</button>
  </div>
  ${petunjuk()}
  <p class="foot">Panitia? <a href="#/admin">Masuk halaman admin</a><br><span style="opacity:.6">v20261117b</span></p></div>`;
}

async function loadTugas() {
  const d = await api('guruTugas', {guru_id: S.guru.id});
  S.guru = d.guru; S.tugas = d.tugas;
}

function viewTugas() {
  const total = S.tugas.length, done = S.tugas.filter(t => isDone(t.status)).length;
  const groups = {};
  S.tugas.forEach(t => { (groups[t.mapel_id] = groups[t.mapel_id] || {mapel: t.mapel, program: t.program, items: []}).items.push(t); });
  const html = Object.values(groups).map(gr => `
    <div class="card">
      <div class="row" style="margin-bottom:4px"><h2 style="margin:0">${esc(gr.mapel)}</h2>${gr.program && gr.program.toLowerCase() !== 'umum' ? `<span class="chip">${esc(gr.program)}</span>` : ''}</div>
      ${gr.items.map(t => `
        <div class="task">
          <div class="grow"><b>${esc(t.kelas)}</b>${t.rekan && t.rekan.length ? ' <span class="chip tt" title="Mapel ini diajar bersama guru lain">Team Teaching</span>' : ''}<div class="muted small">${t.status === 'Diwakilkan' ? 'Sudah disetor oleh ' + esc((t.wakil || []).map(w => w.kode).join(', ')) + ' (Anda dianggap sudah mengisi)' : `${t.terisi} dari ${t.total} siswa terisi${t.status === 'Disetor' ? ' · disetor ' + fmtTime(t.waktu_setor) : ''}`}</div></div>
          ${badge(t.status)}
          <button class="btn sm ${isDone(t.status) ? '' : 'primary'}" data-act="bukaTugas" data-id="${esc(t.id)}">${t.status === 'Disetor' ? 'Lihat' : (t.status === 'Diwakilkan' ? 'Buka' : (t.status === 'Draft' ? 'Lanjutkan' : 'Isi nilai'))}</button>
        </div>`).join('')}
    </div>`).join('');
  const semua = total > 0 && done === total;
  return `<div class="wrap">${brand()}
    <div class="card">
      <div class="row between"><div><h1 style="margin:0">${esc(S.guru.nama)}</h1><span class="muted small">${done} dari ${total} penugasan sudah disetor</span></div>
      <button class="btn sm" data-act="ganti">Ganti guru</button></div>
      <div style="margin-top:12px">${progBar(done, S.tugas.filter(t => t.status === 'Draft').length, total)}</div>
    </div>
    ${S.guru.selesai ? `<div class="notice ok"><b>Terima kasih.</b> Seluruh setoran Anda sudah diterima panitia (${fmtTime(S.guru.waktu_selesai)}).</div>` : ''}
    ${petunjuk()}
    ${html}
    ${S.guru.selesai ? '' : `<div class="sticky"><button class="btn primary block" style="margin-top:0" data-act="selesai" ${semua ? '' : 'disabled'}>${semua ? 'Selesai — kirim notifikasi ke panitia' : 'Setor semua penugasan untuk menyelesaikan'}</button></div>`}
  </div>`;
}

async function bukaTugas(id) {
  await run(async () => {
    const d = await api('tugasDetail', {pid: id});
    S.cur = d.tugas;
    S.rows = d.siswa.map(s => ({nis: s.nis, nama: s.nama, nilai: s.nilai === '' ? '' : tampil(s.nilai)}));
    S.kelasTersedia = d.kelas_tersedia || [];
    S.locked = d.tugas.status === 'Disetor';
    S.dirty = false;
    S.view = 'input';
    renderGuru();
    updateStats();
  });
}

function rowsHtml() {
  return S.rows.map((r, i) => {
    const th = /^th$/i.test(r.nilai);
    const p = parseNilai(r.nilai);
    return `<tr>
      <td class="muted" style="width:34px">${i + 1}</td>
      <td><b>${esc(r.nama)}</b><div class="muted small">${esc(r.nis)}</div></td>
      <td><div class="nilai-cell">
        <input class="nilai ${p.bad ? 'bad' : ''} ${th ? 'th' : ''}" data-i="${i}" inputmode="decimal" autocomplete="off" placeholder="0–100" value="${esc(r.nilai)}" ${S.locked || th ? 'disabled' : ''}>
        ${S.locked ? '' : `<button class="th-btn ${th ? 'on' : ''}" data-act="toggleTH" data-i="${i}" title="Tidak hadir">TH</button>`}
      </div></td></tr>`;
  }).join('');
}

function viewInput() {
  const t = S.cur;
  if (!S.rows.length) {
    return `<div class="wrap">
    <div class="row" style="margin-bottom:12px"><button class="btn sm" data-act="kembali">← Kembali</button></div>
    <div class="card"><h1 style="margin:0">${esc(t.mapel)}</h1><span class="muted">Kelas <b>${esc(t.kelas)}</b> · ${esc(t.guru)}</span></div>
    <div class="notice bad"><b>Data siswa kelas ${esc(t.kelas)} tidak ditemukan.</b><br>
      Hubungi panitia. Pastikan sheet <b>Siswa</b> berisi kolom <b>nis, nama, kelas</b> dan nama kelasnya sama dengan di sheet Penugasan.
      ${S.kelasTersedia.length ? `<div class="small" style="margin-top:8px">Kelas yang terbaca di sheet Siswa: ${esc(S.kelasTersedia.join(', '))}</div>` : `<div class="small" style="margin-top:8px">Sheet Siswa tidak berisi data yang terbaca.</div>`}
    </div></div>`;
  }
  return `<div class="wrap">
    <div class="row" style="margin-bottom:12px"><button class="btn sm" data-act="kembali">← Kembali</button></div>
    <div class="card">
      <div class="row between"><div><h1 style="margin:0">${esc(t.mapel)}</h1><span class="muted">Kelas <b>${esc(t.kelas)}</b> · ${esc(t.guru)}</span></div>${badge(t.status)}</div>
      ${S.locked ? `<div class="notice ok" style="margin:12px 0 0">Nilai sudah disetor pada ${fmtTime(t.waktu_setor)}. Untuk mengubah, klik <b>Revisi nilai</b>.</div>` : `<p class="muted small" style="margin:10px 0 0">Isi nilai murni hasil ujian (0–100, boleh desimal). Ketik <b>TH</b> atau tekan tombol TH bila siswa tidak hadir.</p>`}
    </div>
    ${teamNote(t)}
    ${S.locked ? `<div class="row" style="margin-bottom:12px"><button class="btn" data-act="revisi">Revisi nilai</button></div>` : `
    <div class="card">
      <div class="row between"><div class="grow"><b>Isi nilai</b><div class="muted small">Daftar siswa tampil otomatis. Ketik nilai di samping nama siswa, tekan Enter untuk pindah ke siswa berikutnya.</div></div>
      <div class="row"><button class="btn sm" data-act="template">⬇ Template Excel</button><button class="btn sm" data-act="impor">⬆ Impor Excel</button></div></div>
      <input type="file" id="fileImpor" accept=".xlsx,.xls,.csv" style="display:none">
    </div>`}
    ${S.locked ? '' : petunjuk()}
    <div class="legend"><b>TH = Tidak Hadir.</b> Tekan tombol TH bila siswa tidak mengikuti ujian (jangan diisi 0). Siswa TH dihitung terisi tetapi tidak masuk rata-rata. Desimal boleh pakai koma, contoh <b>85,5</b>.</div>
    <div class="row between" style="margin-bottom:8px"><div id="stat" class="muted small"></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>No</th><th>Siswa</th><th class="num">Nilai</th></tr></thead><tbody id="rows">${rowsHtml()}</tbody></table></div>

  </div>`;
}

function updateStats() {
  const el = document.getElementById('stat');
  if (!el) return;
  let filled = 0, bad = 0, th = 0, sum = 0, n = 0;
  S.rows.forEach(r => { const p = parseNilai(r.nilai); if (p.empty) return; if (p.bad) { bad++; return; } filled++; if (p.th) th++; else { sum += p.val; n++; } });
  el.innerHTML = `Terisi <b>${filled}</b> / ${S.rows.length}${th ? ` · TH ${th}` : ''}${n ? ` · rata-rata sementara <b>${fmt(sum / n)}</b>` : ''}${bad ? ` · <span style="color:var(--bad)">${bad} nilai tidak valid</span>` : ''}`;
}

function collectItems() {
  const items = [];
  for (const r of S.rows) {
    const p = parseNilai(r.nilai);
    if (p.empty) continue;
    if (p.bad) throw new Error(`Nilai "${r.nilai}" milik ${r.nama} tidak valid (harus 0–100 atau TH).`);
    items.push({nis: r.nis, nilai: p.val});
  }
  return items;
}

async function simpanDraft() {
  await run(async () => {
    const items = collectItems();
    await api('simpanNilai', {pid: S.cur.id, items});
    S.dirty = false;
    toast('Draft tersimpan', 'ok');
  });
}

function openReview() {
  let kosong = [], bad = [], rendah = [], nums = [], th = 0;
  S.rows.forEach(r => {
    const p = parseNilai(r.nilai);
    if (p.empty) kosong.push(r.nama);
    else if (p.bad) bad.push(r.nama);
    else if (p.th) th++;
    else { nums.push(p.val); if (p.val < 10) rendah.push(`${r.nama} (${fmt(p.val)})`); }
  });
  const n = nums.length, mean = n ? nums.reduce((a, b) => a + b, 0) / n : null;
  const blocked = kosong.length > 0 || bad.length > 0;
  openModal(`
    <h2>Periksa sebelum setor</h2>
    <p class="muted small" style="margin-bottom:4px">${esc(S.cur.mapel)} · Kelas ${esc(S.cur.kelas)}</p>
    <div class="sumgrid">
      <div><b>${S.rows.length - kosong.length - bad.length}/${S.rows.length}</b><span>Siswa terisi</span></div>
      <div><b>${fmt(mean)}</b><span>Rata-rata</span></div>
      <div><b>${n ? fmt(Math.max(...nums)) : '–'}</b><span>Tertinggi</span></div>
      <div><b>${n ? fmt(Math.min(...nums)) : '–'}</b><span>Terendah</span></div>
    </div>
    ${th ? `<p class="small muted">${th} siswa tercatat tidak hadir (TH) dan tidak dihitung dalam rata-rata.</p>` : ''}
    ${kosong.length ? `<div class="notice bad"><b>${kosong.length} siswa belum diisi:</b> ${esc(kosong.slice(0, 6).join(', '))}${kosong.length > 6 ? ', …' : ''}<br>Isi nilainya, atau tulis TH bila tidak hadir.</div>` : ''}
    ${bad.length ? `<div class="notice bad"><b>Nilai tidak valid:</b> ${esc(bad.join(', '))}</div>` : ''}
    ${rendah.length && !blocked ? `<div class="notice warn"><b>Mohon cek ulang</b> nilai di bawah 10: ${esc(rendah.slice(0, 5).join(', '))}${rendah.length > 5 ? ', …' : ''}</div>` : ''}
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button class="btn" data-act="closeModal">Kembali periksa</button>
      ${blocked ? '' : `<button class="btn primary" data-act="konfirmSetor">Ya, setor nilai</button>`}
    </div>`);
}

async function konfirmSetor() {

function unduhTemplate() {
  const aoa = [['NIS', 'Nama Siswa', 'Nilai']].concat(S.rows.map(r => [r.nis, r.nama, '']));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch: 14}, {wch: 34}, {wch: 10}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Nilai');
  const nama = `Template_Nilai_${S.cur.kelas}_${S.cur.mapel}`.replace(/[^\w\-]+/g, '_');
  XLSX.writeFile(wb, nama + '.xlsx');
}

function imporFile(file) {
  const rd = new FileReader();
  rd.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type: 'array'});
      const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: ''});
      if (!data.length) throw new Error('File kosong.');
      const keys = Object.keys(data[0]);
      const kNis = keys.find(k => /nis/i.test(k)), kNilai = keys.find(k => /nilai|skor|score/i.test(k));
      if (!kNis || !kNilai) throw new Error('Kolom "NIS" dan "Nilai" tidak ditemukan. Gunakan template dari aplikasi ini.');
      const norm = x => String(x).trim().replace(/^0+/, '');
      const idx = {}; S.rows.forEach((r, i) => idx[norm(r.nis)] = i);
      let ok = 0, miss = 0, bad = 0;
      data.forEach(d => {
        const i = idx[norm(d[kNis])];
        const raw = String(d[kNilai] == null ? '' : d[kNilai]).trim();
        if (i === undefined) { if (norm(d[kNis])) miss++; return; }
        if (raw === '') return;
        if (parseNilai(raw).bad) bad++;
        S.rows[i].nilai = tampil(raw); ok++;
      });
      S.dirty = true;
      renderGuru();
      updateStats();
      toast(`${ok} nilai diimpor${miss ? `, ${miss} NIS tidak dikenali` : ''}${bad ? `, ${bad} nilai tidak valid` : ''}. Periksa lalu simpan.`, bad || miss ? 'err' : 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };
  rd.readAsArrayBuffer(file);
}

async function loadLeger() {
  S.legerKey = S.legerSel;

function legerCalc(g) {
  const cols = g.mapel;
  const rows = g.siswa.map(s => {
    let sum = 0, n = 0;
    cols.forEach(c => { const v = s.nilai[c.gid]; if (typeof v === 'number') { sum += v; n++; } });
    return {s, sum, n, avg: n ? sum / n : null};
  });
  const stat = cols.map(c => {
    const nums = g.siswa.map(s => s.nilai[c.gid]).filter(v => typeof v === 'number');
    return nums.length ? {rata: nums.reduce((a, b) => a + b, 0) / nums.length, max: Math.max(...nums), min: Math.min(...nums)} : null;
  });
  return {rows, stat};
}

function legerBlock(g) {
  const cols = g.mapel;
  if (!g.siswa.length) return `<div class="card"><h2>Kelas ${esc(g.kelas)}</h2><p class="muted" style="margin:0">Belum ada data siswa untuk kelas ini.</p></div>`;
  if (!cols.length) return `<div class="card"><h2>Kelas ${esc(g.kelas)}</h2><p class="muted" style="margin:0">Belum ada penugasan mapel untuk kelas ini.</p></div>`;
  const c = legerCalc(g);
  const pend = cols.filter(x => x.status !== 'Disetor').length;
  const cell = v => v === undefined ? '<td class="num muted">–</td>' : (v === 'TH' ? '<td class="num th-c">TH</td>' : `<td class="num">${fmt(v)}</td>`);
  return `<div style="margin-bottom:24px">
    <div class="row between" style="margin-bottom:8px"><h2 style="margin:0">Daftar nilai kelas ${esc(g.kelas)}</h2>
      <span class="small muted">${g.siswa.length} siswa · ${cols.length} mapel${pend ? ` · <span style="color:var(--warn)">${pend} mapel belum lengkap disetor</span>` : ''}</span></div>
    <div class="tbl-wrap"><table class="lg"><thead><tr><th>No</th><th>NIS</th><th>Nama lengkap</th>
      ${cols.map(m => `<th class="vh ${m.status !== 'Disetor' ? 'pend' : ''}" title="${esc(m.mapel)} — ${esc(guruNames(m))} (${esc(m.status)})"><div>${esc(m.singkat)}</div></th>`).join('')}
      <th class="num">Total nilai</th><th class="num">Rata-rata</th></tr></thead><tbody>

/* ---------- Semua kelas (matriks rata-rata kelas × mapel) ---------- */
function semuaData() {
  const d = S.dash, kn = s => String(s).replace(/\s+/g, ' ').trim().toUpperCase();
  const grup = d.grup || [], mp = {};
  grup.forEach(g => { const id = g.mapel_id || g.mapel; mp[id] = {id, nama: g.mapel, singkat: g.singkat}; });
  const mapel = Object.values(mp).sort((a, b) => a.singkat.localeCompare(b.singkat));
  const rows = d.kelas.map(k => {
    const gs = grup.filter(g => kn(g.kelas) === kn(k.nama));
    const cells = mapel.map(m => {
      const g = gs.filter(x => (x.mapel_id || x.mapel) === m.id)[0];
      return g ? {rata: g.rata, n: g.n, done: g.status === 'Disetor', guru: g.guru} : null;
    });
    const got = cells.filter(c => c && c.rata != null);
    return {kelas: k.nama, siswa: k.siswa, cells, avg: got.length ? got.reduce((a, c) => a + c.rata, 0) / got.length : null,
      progres: `${gs.filter(g => g.status === 'Disetor').length}/${gs.length}`};
  });
  const foot = mapel.map((_, j) => { let s = 0, n = 0; rows.forEach(r => { const c = r.cells[j]; if (c && c.rata != null) { s += c.rata * c.n; n += c.n; } }); return n ? s / n : null; });
  const av = rows.filter(r => r.avg != null);
  return {mapel, rows, foot, footAvg: av.length ? av.reduce((a, r) => a + r.avg, 0) / av.length : null};
}

function adminSemua() {
  const m = semuaData();
  if (!m.rows.length) return '<p class="muted">Belum ada data kelas.</p>';
  return `<div class="row" style="margin-bottom:12px">

      <button class="btn sm" data-act="unduhLengkap">⬇ Unduh lengkap: rekap + nilai siswa semua kelas</button></div>
    <div class="tbl-wrap"><table class="lg"><thead><tr><th>Kelas</th><th class="num">Siswa</th>

      ${m.rows.map(r => `<tr><td class="kl"><button class="linkbtn" data-act="keLeger" data-k="${esc(r.kelas)}" title="Lihat nilai siswa kelas ini">${esc(r.kelas)}</button></td><td class="num">${r.siswa}</td>
        ${r.cells.map(c => !c ? '<td class="num muted">·</td>' : `<td class="num ${c.done ? '' : 'pc'}" title="${esc(c.guru)} · ${c.n} siswa${c.done ? '' : ' · belum lengkap disetor'}">${fmt(c.rata)}</td>`).join('')}
        <td class="num"><b>${fmt(r.avg)}</b></td><td class="num">${esc(r.progres)}</td></tr>`).join('')}
      <tr class="stat"><td colspan="2">Rata-rata semua kelas</td>${m.foot.map(v => `<td class="num">${fmt(v)}</td>`).join('')}<td class="num">${fmt(m.footAvg)}</td><td></td></tr>

}

/* ---------- Ekspor Excel ---------- */
const r2 = x => (x == null ? '' : Math.round(x * 100) / 100);

function legerAoa(g) {
  const c = legerCalc(g), cols = g.mapel;
  const stat = (label, k) => [label, '', '', '', ...c.stat.map(s => s ? r2(s[k]) : ''), '', ''];
  return [['DAFTAR NILAI KELAS ' + g.kelas.toUpperCase()], [],
    ['No', 'Kelas', 'NIS', 'Nama Lengkap', ...cols.map(m => m.singkat), 'Total Nilai', 'Rata-rata'],
    ...c.rows.map((r, i) => [i + 1, g.kelas, r.s.nis, r.s.nama, ...cols.map(m => { const v = r.s.nilai[m.gid]; return v === undefined ? '' : v; }), r.n ? r2(r.sum) : '', r2(r.avg)]),
    [], stat('Rata-rata', 'rata'), stat('Tertinggi', 'max'), stat('Terendah', 'min'), [],
    ['Guru Mata Pelajaran', '', '', '', ...cols.map(m => m.guru)],
    ...ketAoa(cols)];
}

function semuaAoa() {
  const m = semuaData();
  return [['REKAP RATA-RATA NILAI SEMUA KELAS'], [],
    ['Kelas', 'Jumlah Siswa', ...m.mapel.map(x => x.singkat), 'Rata-rata Seluruh Mapel', 'Disetor'],
    ...m.rows.map(r => [r.kelas, r.siswa, ...r.cells.map(c => c && c.rata != null ? r2(c.rata) : ''), r2(r.avg), r.progres]),
    [], ['Rata-rata semua kelas', '', ...m.foot.map(r2), r2(m.footAvg), ''],
    ...ketAoa(m.mapel.map(x => ({singkat: x.singkat, mapel: x.nama})))];
}

function addSheet(wb, aoa, name, used, firstW) {
  let n = String(name).replace(/[\[\]\*\?\/\\:]/g, '-').slice(0, 31) || 'Sheet', b = n, i = 2;
  while (used.has(n.toLowerCase())) n = b.slice(0, 28) + '-' + i++;
  used.add(n.toLowerCase());
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch: firstW || 6}, {wch: 14}, {wch: 14}, {wch: 32}];
  XLSX.utils.book_append_sheet(wb, ws, n);
}

function bukuLeger(list, denganRekap) {
  const wb = XLSX.utils.book_new(), used = new Set();
  if (denganRekap) addSheet(wb, semuaAoa(), 'Rekap Semua Kelas', used, 24);
  list.forEach(g => { if (g.siswa.length && g.mapel.length) addSheet(wb, legerAoa(g), g.kelas, used, 6); });
  return wb;
}

function namaFile(s) { return String(s).replace(/[^\w\-]+/g, '_'); }

function unduhLeger() {
  const all = S.legerSel === '*';
  XLSX.writeFile(bukuLeger(S.leger, all), all ? 'Nilai_Semua_Kelas.xlsx' : 'Nilai_' + namaFile(S.legerSel) + '.xlsx');
}

function unduhSemua() {
  const wb = XLSX.utils.book_new();
  addSheet(wb, semuaAoa(), 'Rekap Semua Kelas', new Set(), 24);

}

function normWA(no) {
  let n = String(no || '').replace(/\D/g, '');
  if (!n) return '';
  if (n.startsWith('0')) n = '62' + n.slice(1);
  else if (n.startsWith('8')) n = '62' + n;
  return n;
}

function ingatkan(id) {
  const g = guruProgress().find(x => x.id === id);
  const no = normWA(g.no_wa);
  if (!no) { toast('Nomor WA guru ini belum diisi di sheet Guru', 'err'); return; }
  const pending = g.ts.filter(t => t.status !== 'Disetor').map(t => `• ${t.mapel} – ${t.kelas}`).join('\n');
  const msg = `Assalamu'alaikum Bapak/Ibu ${g.nama},\n\nMohon segera menyetorkan nilai ${S.cfg.nama_ujian || 'ujian'} yang belum masuk:\n${pending}\n\nSilakan setor melalui:\n${guruLink()}\n\nTerima kasih.\n— Panitia`;
  window.open(`https://wa.me/${no}?text=${encodeURIComponent(msg)}`, '_blank');
}

async function lihatNilai(pid) {
  await run(async () => {
    const d = await api('tugasDetail', {pid});
    const nums = d.siswa.map(s => s.nilai).filter(v => typeof v === 'number');
    const mean = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
    openModal(`<h2>${esc(d.tugas.mapel)} · ${esc(d.tugas.kelas)}</h2>
      <p class="muted small">Guru: ${esc(d.tugas.guru)} · ${badge(d.tugas.status)}${mean != null ? ` · rata-rata ${fmt(mean)}` : ''}</p>
      <div class="tbl-wrap"><table><thead><tr><th>Siswa</th><th class="num">Nilai</th></tr></thead><tbody>
      ${d.siswa.map(s => `<tr><td>${esc(s.nama)}<div class="muted small">${esc(s.nis)}</div></td><td class="num"><b>${s.nilai === '' ? '<span class="muted">–</span>' : (typeof s.nilai === 'number' ? fmt(s.nilai) : esc(s.nilai))}</b></td></tr>`).join('')}

      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="closeModal">Tutup</button></div>`);

async function lihatGrup(gid) {
  await run(async () => {
    const d = await api('grupDetail', {gid}, true);
    const team = d.kolom.length > 1, g = d.grup;
    const nums = d.siswa.map(s => s.nilai).filter(v => typeof v === 'number');

    const cell = v => v === '' ? '<span class="muted">–</span>' : (typeof v === 'number' ? fmt(v) : esc(v));
    openModal(`<h2>${esc(g.mapel)} (${esc(g.singkat)}) · ${esc(g.kelas)}</h2>
      <p class="muted small">Guru: ${guruTag(g.guru, g.gurus)} · ${badge(g.status)}${mean != null ? ` · rata-rata ${fmt(mean)}` : ''}</p>

      <div class="tbl-wrap"><table><thead><tr><th>Siswa</th>${team ? d.kolom.map(k => `<th class="num" title="${esc(k.nama)}">${esc(k.kode)}</th>`).join('') : ''}<th class="num">Nilai akhir</th></tr></thead><tbody>

/* ============================================================
 *  EVENT HANDLER
 * ============================================================ */
const ACT = {
  closeModal: () => closeModal(),
  masuk: async () => {
    const id = document.getElementById('guruSel').value;
    if (!id) { toast('Pilih nama guru terlebih dahulu', 'err'); return; }
    await run(async () => {
      S.guru = {id}; await loadTugas();
      S.savedGuru = id; localStorage.setItem('guru_id', id);
      S.view = 'tugas'; renderGuru();
    });
  },
  ganti: () => { S.view = 'login'; renderGuru(); },
  bukaTugas: el => bukaTugas(el.dataset.id),
  kembali: async () => {
    if (S.dirty && !confirm('Ada perubahan yang belum disimpan. Tetap keluar?')) return;
    await run(async () => { await loadTugas(); S.view = 'tugas'; S.dirty = false; renderGuru(); });
  },
  kembaliTugas: () => { S.view = 'tugas'; renderGuru(); },
  toggleTH: el => {
    const i = +el.dataset.i;
    S.rows[i].nilai = /^th$/i.test(S.rows[i].nilai) ? '' : 'TH';
    S.dirty = true;
    document.getElementById('rows').innerHTML = rowsHtml();
    updateStats();
  },
  template: () => unduhTemplate(),
  impor: () => document.getElementById('fileImpor').click(),
  simpan: () => simpanDraft(),
  review: () => {
    try { collectItems(); } catch (e) { toast(e.message, 'err'); return; }
    openReview();
  },
  konfirmSetor: () => konfirmSetor(),
  revisi: async () => {
    if (!confirm('Buka kembali nilai ini untuk direvisi? Status setoran akan kembali menjadi draft.')) return;
    await run(async () => { await api('bukaRevisi', {pid: S.cur.id}); await bukaTugas(S.cur.id); toast('Nilai dibuka untuk revisi'); });
  },
  selesai: async () => {
    if (!confirm('Kirim notifikasi selesai ke panitia? Pastikan semua nilai sudah benar.')) return;
    await run(async () => { await api('selesaiGuru', {guru_id: S.guru.id}); await loadTugas(); S.view = 'selesai'; renderGuru(); });
  },
  // admin
  logout: () => adminLogout(),
  refresh: () => { S.rekap = null; S.leger = null; S.legerKey = null; loadDash(); },
  tab: el => { S.tab = el.dataset.t; renderAdmin(); },
  salinLink: () => {
    const i = document.getElementById('linkGuru'); i.select();
    (navigator.clipboard ? navigator.clipboard.writeText(i.value) : Promise.reject()).then(() => toast('Link disalin', 'ok')).catch(() => { document.execCommand('copy'); toast('Link disalin', 'ok'); });
  },
  detailGuru: el => { const id = el.dataset.id; S.expand.has(id) ? S.expand.delete(id) : S.expand.add(id); renderAdmin(); },
  ingatkan: el => ingatkan(el.dataset.id),
  lihatNilai: el => lihatNilai(el.dataset.id),
  lihatGrup: el => lihatGrup(el.dataset.id),
  infoGuru: el => {
    let arr = [];
    try { arr = JSON.parse(el.dataset.g || '[]'); } catch (e) { /* abaikan */ }
    openModal(`<h2>${esc(el.dataset.l)}</h2>
      ${el.dataset.l === 'Team Teaching' ? '<p class="muted small">Mapel ini diajar bersama. Nilai akhir siswa = rata-rata nilai dari guru yang menginput.</p>' : ''}
      <ul class="feed">${arr.map(g => `<li><b>${esc(g.k)}</b> — ${esc(g.n)}${g.p ? `<div class="muted small">${esc(g.p)}</div>` : ''}</li>`).join('')}</ul>
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="closeModal">Tutup</button></div>`);
  },
  unduhRekap: () => unduhRekap(),
  unduhLeger: () => unduhLeger(),
  unduhSemua: () => unduhSemua(),
  unduhLengkap: () => unduhLengkap(),
  keLeger: el => { S.legerSel = el.dataset.k; S.legerKey = null; S.leger = null; S.tab = 'leger'; renderAdmin(); },
  closeModalBg: (el, e) => { if (e.target === el) closeModal(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});

document.addEventListener('input', e => {
  if (e.target.classList.contains('nilai')) {
    const i = +e.target.dataset.i;
    S.rows[i].nilai = e.target.value;
    S.dirty = true;
    const p = parseNilai(e.target.value);
    e.target.classList.toggle('bad', !!p.bad);
    updateStats();
  } else if (e.target.id === 'fCari') {
    S.q = e.target.value; const pos = e.target.selectionStart; renderAdmin();
    const n = document.getElementById('fCari'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'fileImpor' && e.target.files[0]) { imporFile(e.target.files[0]); e.target.value = ''; }
  else if (e.target.id === 'fFilter') { S.filter = e.target.value; renderAdmin(); }
  else if (e.target.id === 'fLeger') { S.legerSel = e.target.value; S.legerKey = null; S.leger = null; renderAdmin(); }
  else if (e.target.id === 'fKelas') { S.kelasSel = e.target.value; S.rekap = null; renderAdmin(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('nilai')) {
    e.preventDefault();
    const all = [...document.querySelectorAll('input.nilai:not(:disabled)')];
    const nx = all[all.indexOf(e.target) + 1];
    if (nx) { nx.focus(); nx.select(); }
  }
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'formAdmin') return;
  e.preventDefault();
  const user = document.getElementById('aUser').value, pass = document.getElementById('aPass').value;
  await run(async () => {
    const r = await api('login', {user, pass});
    S.adminToken = r.token; sessionStorage.setItem('adm_tok', r.token);
    await initAdmin();
  });
});

window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
