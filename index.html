<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setor Nilai Ujian</title>
<meta name="theme-color" content="#0b5db0">
<meta name="color-scheme" content="dark light">
<script>
/* tema diset sebelum halaman tampil agar tidak berkedip */
(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}
if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* ===== Tema e-Rapor (seragam dengan raporpkl.html — Biro Penilaian Kurikulum) ===== */
:root{
  --bg:#f2f5f9;--bg2:#e7edf5;--card:#fff;--card-s:#fff;--ink:#1c2733;--muted:#5d6b7a;--line:#dde3ea;
  --brand:#0b5db0;--brand-d:#0b5db0;--brand-l:#e7f0fb;--acc:#2272c3;--ind:#1a4d80;--ind-l:#dcebfa;
  --navy:#12304f;--side:#26384d;
  --ok:#1b7f4b;--ok-l:#dff5e8;--warn:#8a5a00;--warn-l:#fff1c9;--bad:#b3261e;--bad-l:#fde4e2;
  --gray-l:#f3f7fc;--field:#fff;--r:10px;--sh:0 1px 4px rgba(18,48,79,.07);--glow:0 12px 40px rgba(0,0,0,.22);
  --fd:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --grid:#c3cfdc;--hdr:#fff;--thead:#eaf1f8;--hover:rgba(11,93,176,.035);--dirty:#fff6d6
}
:root[data-theme=dark]{
  --bg:#0e1621;--bg2:#121c29;--card:#16212f;--card-s:#16212f;--ink:#e5ecf4;--muted:#93a4b7;--line:#283547;
  --brand:#3b8eea;--brand-d:#8ec5ff;--brand-l:#1c2f47;--acc:#5aa3f0;--ind:#a9ccf0;--ind-l:#1c3350;
  --navy:#cfe0f5;
  --ok:#9be0b8;--ok-l:#173a28;--warn:#f0dc9a;--warn-l:#3a3213;--bad:#f5b3ae;--bad-l:#4a1e1b;
  --gray-l:#1a2736;--field:#0e1621;--sh:0 1px 4px rgba(0,0,0,.35);--glow:0 12px 40px rgba(0,0,0,.5);
  --grid:#3a4b62;--hdr:#121c29;--thead:#1d2b3d;--hover:rgba(90,163,240,.06);--dirty:#4a4220
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
#app,#modal-root{position:relative;z-index:1}
#app.vin{animation:vin .25s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3,.brand b,.stat b,.sumgrid b{font-family:var(--fd)}
h1{font-size:20px;margin:0 0 6px;line-height:1.25;font-weight:700;color:var(--navy)}
h2{font-size:17px;margin:0 0 10px;font-weight:700;color:var(--navy)}
h3{font-size:15px;margin:0;color:var(--navy)}
p{margin:0 0 12px}
a{color:var(--brand);text-underline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.wrap.narrow{max-width:460px;padding-top:6vh}
.wrap.wide{max-width:1280px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.card.pad{padding:24px}
/* logo / brand */
.logo{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#fff;border:1px solid var(--line);overflow:hidden;flex:0 0 auto}
.logo img,.logo svg{width:100%;height:100%;object-fit:contain;padding:6px;display:block}
.logo.sm{width:40px;height:40px}.logo.sm img,.logo.sm svg{padding:4px}
.brand{text-align:center;margin-bottom:20px}
.brand .logo{width:84px;height:84px;margin-bottom:12px;box-shadow:0 3px 11px rgba(18,48,79,.25)}
.brand b{display:block;font-size:18px;font-weight:700;color:var(--navy)}
.brand span{color:var(--muted);font-size:13px}
/* form */
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px;color:var(--muted)}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--field);color:var(--ink)}
select option{background:var(--card-s);color:var(--ink)}
input::placeholder{color:var(--muted);opacity:.75}
input:focus,select:focus{outline:2px solid var(--brand-d);outline-offset:-1px;border-color:var(--brand)}
input:disabled{background:var(--gray-l);color:var(--muted)}
/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--brand);background:var(--card);color:var(--brand);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .14s,box-shadow .14s}
.btn:hover{background:var(--brand-l)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.tab:focus-visible,.th-btn:focus-visible,#themeBtn:focus-visible{outline:2px solid var(--brand-d);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--acc);border-color:var(--acc);box-shadow:0 3px 8px rgba(11,93,176,.24)}
:root[data-theme=dark] .btn.primary{color:#fff}
.btn.wa{background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme=dark] .btn.wa{background:#1b7f4b;border-color:#1b7f4b;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{display:flex;width:100%;margin-top:18px;padding:11px 16px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}
/* badge & chip */
.badge{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;border:0;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-Belum{background:var(--bad-l);color:var(--bad)}
.b-Draft{background:var(--warn-l);color:var(--warn)}
.b-Disetor,.b-ok{background:var(--ok-l);color:var(--ok)}
.b-info{background:var(--gray-l);color:var(--muted)}
.b-Diwakilkan{background:var(--ind-l);color:var(--ind)}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--brand-l);color:var(--brand);font-size:12px;font-weight:600}
.chip.tt{background:var(--ind-l);color:var(--ind)}
/* progress */
.prog{height:10px;border-radius:6px;background:#e3eaf2;overflow:hidden;display:flex;min-width:90px}
:root[data-theme=dark] .prog{background:#243448}
.prog i{display:block;height:100%;transform-origin:left;animation:grow .6s ease-out}
@keyframes grow{from{transform:scaleX(0)}}
.prog .g{background:linear-gradient(90deg,#0b5db0,#2b8de3)}.prog .y{background:#e9b33b}
.ring{--p:0;flex:0 0 auto;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--brand) calc(var(--p)*1%),#e3eaf2 0);transition:background .6s}
:root[data-theme=dark] .ring{background:conic-gradient(var(--brand) calc(var(--p)*1%),#243448 0)}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card-s)}
.ring b{position:relative;z-index:1;font:700 13px var(--fd);color:var(--navy)}
/* statistik */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.stat{--c:var(--brand);position:relative;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:16px;box-shadow:var(--sh);transition:box-shadow .2s,transform .2s}
.stat:hover{box-shadow:0 6px 18px rgba(18,48,79,.14);transform:translateY(-2px)}
.stat b{display:block;font-size:28px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.stat span{color:var(--muted);font-size:13px}
/* tab */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0;margin:0 0 14px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;scrollbar-width:none}
.tab{padding:10px 14px;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);background:none;box-shadow:none}
/* topbar */
.topbar{position:sticky;top:0;z-index:20;background:var(--hdr);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(18,48,79,.06)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
/* tabel */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 11px;text-align:left;border:1px solid var(--grid);vertical-align:middle}
thead th{border-top:0}
th:first-child,td:first-child{border-left:0}
th:last-child,td:last-child{border-right:0}
th{font-size:12.5px;color:var(--muted);background:var(--thead);white-space:nowrap}
tbody tr:hover td{background:var(--hover)}
tr:last-child td{border-bottom:0}
table{border-style:hidden}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.sticky{position:sticky;bottom:0;z-index:5;background:linear-gradient(transparent,var(--bg) 35%);padding:20px 0 calc(12px + env(safe-area-inset-bottom));margin-top:8px}
.nilai-cell{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.nilai-cell input{width:88px;text-align:center;font:600 16px var(--fd);padding:7px}
.nilai-cell input.ok{border-color:var(--ok)}
.nilai-cell input.bad{border-color:var(--bad);background:var(--bad-l)}
.nilai-cell input.th{background:var(--gray-l);color:var(--muted)}
.th-btn{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--gray-l);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.th-btn:hover{border-color:var(--brand)}
.th-btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* notice */
.notice{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px;border:1px solid transparent}
.notice.ok{background:var(--ok-l);color:var(--ok);border-color:rgba(27,127,75,.25)}
.notice.warn{background:var(--warn-l);color:var(--warn);border-color:#e9b33b}
.notice.bad{background:var(--bad-l);color:var(--bad);border-color:#f3b8b3}
.notice b{color:inherit}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,45,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;animation:fade .15s}
.modal{background:var(--card-s);border:1px solid var(--line);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:22px;box-shadow:var(--glow);animation:rise .2s ease-out}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(16px);opacity:0}}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:12px}}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.sumgrid div{background:var(--gray-l);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.sumgrid b{display:block;font-size:22px;font-weight:700;color:var(--navy)}
.sumgrid span{font-size:12px;color:var(--muted)}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:#1c2733;color:#fff;border:0;border-left:4px solid var(--brand);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(12,32,56,.28);width:100%;animation:rise .2s}
.toast.err{background:#b3261e;border-left-color:#7d1a14}.toast.ok{background:#1b7f4b;border-left-color:#10593a}
/* loading: lingkaran titik berputar seperti e-Rapor */
#loader{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(15,25,40,.42);-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px)}
#loader.on{display:flex;animation:fade .15s}
#loader.first{background:var(--bg)}
.orbit{position:relative;width:132px;height:132px;display:grid;place-items:center;transition:transform .3s}
#loader:not(.first) .orbit{transform:scale(.5);margin:-28px 0}
.orbit i{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--brand);border-left-color:rgba(11,93,176,.25);animation:spin 1.2s linear infinite}
.orbit i+i{inset:13px;border-top-color:transparent;border-bottom-color:#2b8de3;border-right-color:rgba(43,141,227,.25);animation-duration:1.9s;animation-direction:reverse}
.orbit .logo{width:62px;height:62px;box-shadow:0 3px 11px rgba(18,48,79,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.lmsg{position:relative;font:600 13.5px var(--fd);color:var(--brand);letter-spacing:.2px}
#loader:not(.first) .lmsg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;box-shadow:0 14px 38px rgba(12,32,56,.24)}
.lbar{position:relative;width:150px;height:3px;border-radius:9px;background:var(--gray-l);overflow:hidden}
.lbar::after{content:"";position:absolute;inset:0;width:45%;background:linear-gradient(90deg,transparent,var(--brand),#2b8de3,transparent);animation:slide 1.1s ease-in-out infinite}
#loader:not(.first) .lbar{display:none}
@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(250%)}}
/* tombol tema */
#themeBtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card-s);color:var(--navy);font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(18,48,79,.2);transition:background .15s}
#themeBtn:hover{background:var(--brand-l)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:20px}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.sub{background:var(--gray-l)}
.sub td{padding:8px 12px 8px 28px;font-size:14px}
.linkbox{display:flex;gap:8px}
.linkbox input{font-family:ui-monospace,Menlo,monospace;font-size:13px}
th.vh{height:auto;width:40px;min-width:40px;max-width:40px;padding:8px 2px;text-align:center;vertical-align:bottom;letter-spacing:0;font-size:12px}
.vh>div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;margin:0 auto;max-height:150px;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
td.vh{vertical-align:top;height:auto;width:40px;max-width:40px;text-align:center;padding:6px 2px;font-size:12px}
table.lg{width:100%;min-width:0}
table.lg td.nm{font-weight:600;color:var(--navy)}
table.lg th.vh.pend,table.lg th.pend{background:var(--warn-l);color:var(--warn)}
table.lg th,table.lg td{padding:6px 8px;font-size:13px}
table.lg th.vh,table.lg td.vh{padding:6px 2px}
table.lg th.num,table.lg td.num{padding:6px 7px}
table.lg td.nm,table.lg td.kl{white-space:nowrap}
.abbr{margin-top:14px;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.abbr h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.abbr ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 20px}
.abbr li{display:flex;gap:10px;align-items:baseline;font-size:13px;line-height:1.35}
.abbr li b{flex:0 0 64px;color:var(--brand)}
.note{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.6}
.gl{margin-top:4px;font-size:12px;color:var(--muted);line-height:1.45}
th.pend{background:var(--warn-l);color:var(--warn)}
td.pc{background:var(--warn-l)}
tr.stat{display:table-row;border:0;border-radius:0;box-shadow:none;padding:0;background:none;transform:none!important;transition:none}
tr.stat:hover{transform:none!important;box-shadow:none}
tr.stat td{background:var(--thead);font-weight:600;color:var(--navy)}
tr.stat td:first-child{border-left:0}
tr.stat td.num{font-weight:700}
tr.stat:hover td{background:var(--thead)}
td.th-c{color:var(--muted);font-weight:700}
.linkbtn{background:none;border:0;padding:0;font:inherit;white-space:nowrap;color:var(--brand);cursor:pointer;font-weight:700;text-align:left}
.linkbtn:hover{text-decoration:underline}
details.help{padding:0}
details.help summary{padding:14px 16px;cursor:pointer;list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help[open] summary{border-bottom:1px solid var(--line)}
details.help .body{padding:12px 16px 16px;font-size:14px}
details.help ol,details.help ul{margin:6px 0 12px;padding-left:20px}
details.help li{margin-bottom:5px}
.legend{background:var(--gray-l);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:10px}
.hide-sm{display:table-cell}
@media(max-width:640px){.hide-sm{display:none}.wrap{padding:12px}h1{font-size:18px}.btn,.btn.sm{min-height:40px}input,select{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="loader" class="on first" role="status" aria-live="polite">
  <div class="orbit"><i></i><i></i><span id="ldLogo"></span></div>
  <div class="lmsg">Menyiapkan aplikasi…</div>
  <div class="lbar"></div>
</div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<button id="themeBtn" type="button" aria-label="Ganti tema terang/gelap" title="Ganti tema">◐</button>

<script>
/* ============================================================
 *  KONFIGURASI  -  ganti dengan URL Web App Apps Script Anda
 * ============================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxKPp2yCczPw5uLQI4hETy3E_GJ5hl2H2U4LkQwuagxLP8jF3fhQxkFibe6_vlR688c/exec'
};

/* ============================================================
 *  UTILITAS
 * ============================================================ */
/* ============================================================
 *  LOGO & FAVICON dari GitHub
 *  Unggah file ke repo GitHub Anda (mis. folder assets/), lalu isi:
 *    GITHUB_USER : username atau organisasi GitHub
 *    REPO        : nama repository
 *    BRANCH      : cabang (main / master)
 *    LOGO        : path logo di repo (PNG/SVG/WebP, latar transparan)
 *    FAVICON     : path favicon di repo (PNG persegi 64/128/192 px, atau .ico)
 *  Repo harus publik. Bila belum diisi / gambar gagal dimuat, aplikasi
 *  memakai logo bawaan sehingga tampilan tidak rusak.
 * ============================================================ */
const BRAND = {
  GITHUB_USER: 'inascahayaiman',
  REPO: 'setor_nilai_ujian',
  BRANCH: 'main',
  LOGO: 'logo.png',
  FAVICON: 'favicon.png',
  CDN: 'raw',      // 'raw' = raw.githubusercontent.com | 'jsdelivr' = cdn.jsdelivr.net (lebih cepat, cache ~12 jam)
  VERSION: '1'     // naikkan angkanya setelah mengganti gambar agar cache browser diperbarui
};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n == null || n === '') ? '–' : Number(n).toLocaleString('id-ID', {maximumFractionDigits: 2});
const fmtTime = iso => iso ? new Date(iso).toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '–';
const guruLink = () => location.origin + location.pathname;

const S = {
  cfg: {}, guruList: [], savedGuru: localStorage.getItem('guru_id') || '',
  view: 'login', guru: null, tugas: [], cur: null, rows: [], locked: false, dirty: false,
  adminToken: sessionStorage.getItem('adm_tok') || '', dash: null, tab: 'dashboard',
  legerSel: '', leger: null, legerKey: null,

/* Loading: SATU elemen (#loader) dengan penghitung. Layar penuh saat pertama kali, lalu pil kecil.
   Tertunda 220 ms (request cepat tak berkedip) dan disembunyikan dengan jeda agar tidak muncul-hilang-muncul. */
const L = {n: 0, show: null, hide: null, since: Date.now()};
const ldEl = document.getElementById('loader');
function busy(d, msg) {
  L.n = Math.max(0, L.n + d);
  if (L.n > 0) {
    clearTimeout(L.hide); L.hide = null;
    if (msg) ldEl.querySelector('.lmsg').textContent = msg;
    if (!ldEl.classList.contains('on') && !L.show) L.show = setTimeout(() => { L.show = null; if (L.n > 0) { ldEl.classList.add('on'); L.since = Date.now(); } }, 220);
  } else {
    clearTimeout(L.show); L.show = null;
    if (ldEl.classList.contains('on') && !L.hide) L.hide = setTimeout(() => {
      L.hide = null;
      if (L.n === 0) ldEl.classList.remove('on', 'first');
    }, Math.max(140, 420 - (Date.now() - L.since)));
  }
}
async function run(fn, msg) { busy(1, msg || 'Mohon tunggu…'); try { return await fn(); } catch (e) { toast(e.message || String(e), 'err'); } finally { busy(-1); } }

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;

  setTimeout(() => el.remove(), type === 'err' ? 5000 : 2600);
}

async function api(action, payload, admin) {
  if (CONFIG.API_URL.startsWith('PASTE')) throw new Error('API_URL belum diisi di index.html');
  const body = JSON.stringify(Object.assign({action}, admin ? {token: S.adminToken} : {}, payload || {}));
  // Content-Type default (text/plain) agar tidak memicu preflight CORS pada Apps Script
  const r = await fetch(CONFIG.API_URL, {method: 'POST', body});
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Respons server tidak valid. Pastikan deploy Apps Script: akses "Anyone".'); }
  if (!j.ok) {
    if (j.error === 'AUTH') { adminLogout(true); throw new Error('Sesi admin berakhir, silakan masuk lagi.'); }
    throw new Error(j.error);
  }
  return j.data;
}

function parseNilai(raw) {
  const v = String(raw == null ? '' : raw).trim().replace(',', '.');
  if (v === '') return {empty: true};
  if (/^th$/i.test(v)) return {th: true, val: 'TH'};
  if (!/^\d+(\.\d+)?$/.test(v)) return {bad: true};
  const n = parseFloat(v);
  if (n > 100) return {bad: true};
  return {val: Math.round(n * 100) / 100};
}

const LOGO_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0b5db0"/><path d="M15 7h21l13 13v34a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z" fill="#fff"/><path d="M36 7v13h13z" fill="#a9ccf0"/><path d="M21 38l8 8 14-15" fill="none" stroke="#0b5db0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const brandOn = !/^(USERNAME|GANTI)/i.test(BRAND.GITHUB_USER) && !/^(NAMA|GANTI)/i.test(BRAND.REPO);
// ubah link github.com/.../blob/... menjadi link raw agar bisa dipakai sebagai gambar
function ghRaw(u) {
  const m = String(u).match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/(?:blob|raw)\/(.+?)(?:\?.*)?$/i);
  return m ? `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}` : u;
}
function ghUrl(path) {
  if (!path) return '';
  if (/^https?:\/\//i.test(path)) return ghRaw(path);
  const base = BRAND.CDN === 'jsdelivr'
    ? `https://cdn.jsdelivr.net/gh/${BRAND.GITHUB_USER}/${BRAND.REPO}@${BRAND.BRANCH}/`
    : `https://raw.githubusercontent.com/${BRAND.GITHUB_USER}/${BRAND.REPO}/${BRAND.BRANCH}/`;
  return base + String(path).replace(/^\/+/, '') + '?v=' + BRAND.VERSION;
}
// Urutan: GitHub (BRAND) -> logo_url di sheet Config (bukan Google Drive) -> logo bawaan
function logoSrc() {
  if (brandOn && BRAND.LOGO) return ghUrl(BRAND.LOGO);
  const u = String((S.cfg && S.cfg.logo_url) || '').trim();
  if (!/^https?:\/\//i.test(u) || /drive\.google\.com|googleusercontent\.com|docs\.google\.com/i.test(u)) return '';
  return ghRaw(u);
}
function logoFail(im) { if (im && im.parentNode) im.parentNode.innerHTML = LOGO_SVG; }
function logoHtml(cls) {
  const src = logoSrc();
  return `<span class="logo ${cls || ''}">${src ? `<img src="${esc(src)}" alt="Logo" decoding="async" onerror="logoFail(this)">` : LOGO_SVG}</span>`;
}
const FAV_SVG = 'data:image/svg+xml,' + encodeURIComponent(LOGO_SVG);
function setIcons(icon, touch) {
  document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]').forEach(e => e.remove());
  [['icon', icon], ['apple-touch-icon', touch || icon]].forEach(([rel, href]) => {
    const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
  });
}
const probe = src => new Promise(res => { const im = new Image(); im.onload = () => res(src); im.onerror = () => res(''); im.src = src; });
let iconKey = null;
async function refreshIcons() {
  const k = logoSrc() + '|' + brandOn;
  if (k === iconKey) return;
  iconKey = k;
  setIcons(FAV_SVG);   // favicon bawaan langsung terpasang (tidak pernah 404), diganti bila gambar GitHub berhasil dimuat
  const cand = [];
  if (brandOn && BRAND.FAVICON) cand.push(ghUrl(BRAND.FAVICON));
  if (logoSrc()) cand.push(logoSrc());
  for (const c of cand) { const ok = await probe(c); if (ok) { setIcons(ok, logoSrc() || ok); return; } }
}
function brand() {
  const c = S.cfg || {};

const CU = {};
function enhance() {
  const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('.stat b').forEach(b => {
    const n = parseInt(b.textContent, 10);
    if (isNaN(n) || String(n) !== b.textContent.trim()) return;
    const key = b.nextElementSibling ? b.nextElementSibling.textContent : '';
    if (CU[key] === n) return;
    const from = CU[key] || 0; CU[key] = n;
    if (calm) return;
    const t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 700); b.textContent = Math.round(from + (n - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
document.addEventListener('pointerdown', e => {

  if (b) { const r = b.getBoundingClientRect(); b.style.setProperty('--rx', (e.clientX - r.left) + 'px'); b.style.setProperty('--ry', (e.clientY - r.top) + 'px'); }

function updateStats() {
  const el = document.getElementById('stat');
  if (!el) return;
  let filled = 0, bad = 0, th = 0, sum = 0, n = 0;
  S.rows.forEach(r => { const p = parseNilai(r.nilai); if (p.empty) return; if (p.bad) { bad++; return; } filled++; if (p.th) th++; else { sum += p.val; n++; } });
  el.innerHTML = `Terisi <b>${filled}</b> / ${S.rows.length}${th ? ` · TH ${th}` : ''}${n ? ` · rata-rata sementara <b>${fmt(sum / n)}</b>` : ''}${bad ? ` · <span style="color:var(--bad)">${bad} nilai tidak valid</span>` : ''}`;
}

function collectItems() {
  const items = [];
  for (const r of S.rows) {
    const p = parseNilai(r.nilai);
    if (p.empty) continue;
    if (p.bad) throw new Error(`Nilai "${r.nilai}" milik ${r.nama} tidak valid (harus 0–100 atau TH).`);
    items.push({nis: r.nis, nilai: p.val});
  }
  return items;
}

function unduhTemplate() {
  const aoa = [['NIS', 'Nama Siswa', 'Nilai']].concat(S.rows.map(r => [r.nis, r.nama, '']));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch: 14}, {wch: 34}, {wch: 10}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Nilai');
  const nama = `Template_Nilai_${S.cur.kelas}_${S.cur.mapel}`.replace(/[^\w\-]+/g, '_');
  XLSX.writeFile(wb, nama + '.xlsx');
}

function imporFile(file) {
  const rd = new FileReader();
  rd.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type: 'array'});
      const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: ''});
      if (!data.length) throw new Error('File kosong.');
      const keys = Object.keys(data[0]);
      const kNis = keys.find(k => /nis/i.test(k)), kNilai = keys.find(k => /nilai|skor|score/i.test(k));
      if (!kNis || !kNilai) throw new Error('Kolom "NIS" dan "Nilai" tidak ditemukan. Gunakan template dari aplikasi ini.');
      const norm = x => String(x).trim().replace(/^0+/, '');
      const idx = {}; S.rows.forEach((r, i) => idx[norm(r.nis)] = i);
      let ok = 0, miss = 0, bad = 0;
      data.forEach(d => {
        const i = idx[norm(d[kNis])];
        const raw = String(d[kNilai] == null ? '' : d[kNilai]).trim();
        if (i === undefined) { if (norm(d[kNis])) miss++; return; }
        if (raw === '') return;
        if (parseNilai(raw).bad) bad++;
        S.rows[i].nilai = tampil(raw); ok++;
      });
      S.dirty = true;
      renderGuru();
      updateStats();
      toast(`${ok} nilai diimpor${miss ? `, ${miss} NIS tidak dikenali` : ''}${bad ? `, ${bad} nilai tidak valid` : ''}. Periksa lalu simpan.`, bad || miss ? 'err' : 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };
  rd.readAsArrayBuffer(file);
}

function legerCalc(g) {
  const cols = g.mapel;
  const rows = g.siswa.map(s => {
    let sum = 0, n = 0;
    cols.forEach(c => { const v = s.nilai[c.gid]; if (typeof v === 'number') { sum += v; n++; } });
    return {s, sum, n, avg: n ? sum / n : null};
  });
  const stat = cols.map(c => {
    const nums = g.siswa.map(s => s.nilai[c.gid]).filter(v => typeof v === 'number');
    return nums.length ? {rata: nums.reduce((a, b) => a + b, 0) / nums.length, max: Math.max(...nums), min: Math.min(...nums)} : null;
  });
  return {rows, stat};
}

/* ---------- Semua kelas (matriks rata-rata kelas × mapel) ---------- */
function semuaData() {
  const d = S.dash, kn = s => String(s).replace(/\s+/g, ' ').trim().toUpperCase();
  const grup = d.grup || [], mp = {};
  grup.forEach(g => { const id = g.mapel_id || g.mapel; mp[id] = {id, nama: g.mapel, singkat: g.singkat}; });
  const mapel = urutMapel(Object.values(mp));
  const rows = d.kelas.map(k => {
    const gs = grup.filter(g => kn(g.kelas) === kn(k.nama));
    const cells = mapel.map(m => {
      const g = gs.filter(x => (x.mapel_id || x.mapel) === m.id)[0];
      return g ? {rata: g.rata, n: g.n, done: g.status === 'Disetor', guru: g.guru} : null;
    });
    const got = cells.filter(c => c && c.rata != null);
    return {kelas: k.nama, siswa: k.siswa, cells, avg: got.length ? got.reduce((a, c) => a + c.rata, 0) / got.length : null,
      progres: `${gs.filter(g => g.status === 'Disetor').length}/${gs.length}`};
  });
  const foot = mapel.map((_, j) => { let s = 0, n = 0; rows.forEach(r => { const c = r.cells[j]; if (c && c.rata != null) { s += c.rata * c.n; n += c.n; } }); return n ? s / n : null; });
  const av = rows.filter(r => r.avg != null);
  return {mapel, rows, foot, footAvg: av.length ? av.reduce((a, r) => a + r.avg, 0) / av.length : null};
}

/* ---------- Ekspor Excel ---------- */
const r2 = x => (x == null ? '' : Math.round(x * 100) / 100);

function legerAoa(g) {
  const c = legerCalc(g), cols = g.mapel;
  const stat = (label, k) => [label, '', '', '', ...c.stat.map(s => s ? r2(s[k]) : ''), '', ''];
  return [['DAFTAR NILAI KELAS ' + g.kelas.toUpperCase()], [],
    ['No', 'Kelas', 'NIS', 'Nama Lengkap', ...cols.map(m => m.singkat), 'Total Nilai', 'Rata-rata'],
    ...c.rows.map((r, i) => [i + 1, g.kelas, r.s.nis, r.s.nama, ...cols.map(m => { const v = r.s.nilai[m.gid]; return v === undefined ? '' : v; }), r.n ? r2(r.sum) : '', r2(r.avg)]),
    [], stat('Rata-rata', 'rata'), stat('Tertinggi', 'max'), stat('Terendah', 'min'), [],
    ['Guru Mata Pelajaran', '', '', '', ...cols.map(m => m.guru)],
    ...ketAoa(cols)];
}

function semuaAoa() {
  const m = semuaData();
  return [['REKAP RATA-RATA NILAI SEMUA KELAS'], [],
    ['Kelas', 'Jumlah Siswa', ...m.mapel.map(x => x.singkat), 'Rata-rata Seluruh Mapel', 'Disetor'],
    ...m.rows.map(r => [r.kelas, r.siswa, ...r.cells.map(c => c && c.rata != null ? r2(c.rata) : ''), r2(r.avg), r.progres]),
    [], ['Rata-rata semua kelas', '', ...m.foot.map(r2), r2(m.footAvg), ''],
    ...ketAoa(m.mapel.map(x => ({singkat: x.singkat, mapel: x.nama})))];
}

function addSheet(wb, aoa, name, used, firstW) {
  let n = String(name).replace(/[\[\]\*\?\/\\:]/g, '-').slice(0, 31) || 'Sheet', b = n, i = 2;
  while (used.has(n.toLowerCase())) n = b.slice(0, 28) + '-' + i++;
  used.add(n.toLowerCase());
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch: firstW || 6}, {wch: 14}, {wch: 14}, {wch: 32}];
  XLSX.utils.book_append_sheet(wb, ws, n);
}

function bukuLeger(list, denganRekap) {
  const wb = XLSX.utils.book_new(), used = new Set();
  if (denganRekap) addSheet(wb, semuaAoa(), 'Rekap Semua Kelas', used, 24);
  list.forEach(g => { if (g.siswa.length && g.mapel.length) addSheet(wb, legerAoa(g), g.kelas, used, 6); });
  return wb;
}

function namaFile(s) { return String(s).replace(/[^\w\-]+/g, '_'); }

function unduhLeger() {

function normWA(no) {
  let n = String(no || '').replace(/\D/g, '');
  if (!n) return '';
  if (n.startsWith('0')) n = '62' + n.slice(1);
  else if (n.startsWith('8')) n = '62' + n;
  return n;
}

  if (e.target.id === 'fileImpor' && e.target.files[0]) { imporFile(e.target.files[0]); e.target.value = ''; }
  else if (e.target.id === 'fFilter') { S.filter = e.target.value; renderAdmin(); }
  else if (e.target.id === 'fLeger') { S.legerSel = e.target.value; S.legerKey = null; S.leger = null; renderAdmin(); }
  else if (e.target.id === 'fKelas') { S.kelasSel = e.target.value; S.rekap = null; renderAdmin(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('nilai')) {
    e.preventDefault();
    const all = [...document.querySelectorAll('input.nilai:not(:disabled)')];
    const nx = all[all.indexOf(e.target) + 1];
    if (nx) { nx.focus(); nx.select(); }
  }
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'formAdmin') return;
  e.preventDefault();
  const user = document.getElementById('aUser').value, pass = document.getElementById('aPass').value;
  await run(async () => {
    const r = await api('login', {user, pass});
    S.adminToken = r.token; sessionStorage.setItem('adm_tok', r.token);
    await initAdmin();
  });
});

document.getElementById('ldLogo').innerHTML = logoHtml();
refreshIcons();
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
route();
</script>
</body>
</html>
